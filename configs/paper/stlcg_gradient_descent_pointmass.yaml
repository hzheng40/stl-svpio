presets:
  - id: single_default
    scene_seed: 0
    args:
      task: single_default
      scene: constructed_pointmass_diag
      dt: 0.1
      horizon: 20
      episode_steps: 20
      sampling_mode: uniform
      noise_sigma: 0.3
      stl_approx_method: "true"
      stl_temperature: null
      stl_gd_iters: 200
      stl_gd_step_size: 1.27
      stl_gd_grad_clip_norm: null

  - id: single_visit_goals_long_horizon
    scene_seed: 0
    args:
      task: single_visit_goals
      scene: random
      dt: 0.01
      horizon: 600
      episode_steps: 600
      sampling_mode: uniform
      noise_sigma: 0.2
      num_obstacles: 20
      num_zones: 5
      landmark_sampling_mode: joint
      stl_approx_method: "true"
      stl_temperature: null
      stl_gd_iters: 300
      stl_gd_step_size: 1.7
      stl_gd_grad_clip_norm: null

  - id: multiagent_button
    scene_seed: 0
    args:
      task: multiagent_button
      scene: random
      dt: 0.01
      horizon: 300
      episode_steps: 300
      sampling_mode: truncated_gaussian
      noise_sigma: 0.1
      num_agents: 2
      num_obstacles: 10
      num_zones: 3
      layout_mode: random
      landmark_sampling_mode: sequential
      stl_approx_method: "true"
      stl_temperature: null
      stl_gd_iters: 300
      stl_gd_step_size: 3.0
      stl_gd_grad_clip_norm: 5.0

  - id: multiagent_sync_goals
    scene_seed: 0
    args:
      task: multiagent_sync_goals
      scene: random
      dt: 0.01
      horizon: 300
      episode_steps: 300
      sampling_mode: uniform
      noise_sigma: 0.3
      num_agents: 9
      num_obstacles: 0
      num_zones: 9
      layout_mode: random
      sync_delta_steps: 2
      agent_collision_radius: 0.12
      stl_approx_method: "true"
      stl_temperature: null
      stl_gd_iters: 300
      stl_gd_step_size: 5.0
      stl_gd_grad_clip_norm: 15.0

  - id: multiagent_corridor_6_agents
    scene_seed: 0
    args:
      task: multiagent_corridor
      scene: random
      dt: 0.01
      horizon: 300
      episode_steps: 300
      sampling_mode: uniform
      noise_sigma: 0.5
      num_agents: 6
      num_obstacles: 0
      num_zones: 1
      layout_mode: random
      agent_collision_radius: 0.1
      corridor_half_extent: 0.8
      stl_approx_method: "true"
      stl_temperature: null
      stl_gd_iters: 300
      stl_gd_step_size: 1.3
      stl_gd_grad_clip_norm: 0.5
