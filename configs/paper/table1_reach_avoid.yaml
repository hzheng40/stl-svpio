task_id: single_default
description: "Recovered from compare_pointmass_single_default_methods.py and its saved comparison JSON."
base:
  dt: 0.1
  episode_steps: 20
  horizon: 20
  scene: constructed_pointmass_diag
  seed: 0
  task: single_default
  stl_approx_method: logsumexp
  stl_temperature: 50.0
  record_svgd_history: true
methods:
  stl_svpio:
    num_samples: 10
    sampling_mode: uniform
    noise_sigma: 0.3
    temperature: 0.8
    svgd_iters: 20
    svgd_selection_mode: best
    svgd_step_anneal: exp
    svgd_step_final: 10.0
    svgd_step_size: 500.0
    report_robustness: true_robustness
  mppi:
    num_samples: 10
    sampling_mode: truncated_gaussian
    noise_sigma: 0.3
    temperature: 0.8
    svgd_iters: 200
    svgd_selection_mode: best
    svgd_step_anneal: exp
    svgd_step_final: 10.0
    svgd_step_size: 500.0
    cost_mode: heuristic_reach_avoid
    heuristic_stage_goal_weight: 0.1
    heuristic_stage_obstacle_weight: 25.0
    heuristic_terminal_goal_weight: 8.0
    heuristic_terminal_obstacle_weight: 100.0
    heuristic_margin: 0.0
    report_robustness: evaluation_robustness
  svmpc:
    num_samples: 64
    sampling_mode: uniform
    noise_sigma: 0.3
    temperature: 1.0
    svgd_iters: 200
    svgd_step_size: 500.0
    svgd_step_anneal: exp
    svgd_step_final: 0.1
    stl_approx_method: "true"
    stl_temperature: null
  dpi:
    num_samples: 1024
    sampling_mode: truncated_gaussian
    noise_sigma: 256.0
    temperature: 0.8
    svgd_iters: 200
    dpi_iters: 200
    dpi_shrink_factor: 0.99
    dpi_min_temperature: 0.01
    dpi_augmented_mode: implicit
    stl_approx_method: "true"
    stl_temperature: null
  stlcg_gradient_descent:
    num_samples: 1
    sampling_mode: uniform
    noise_sigma: 0.3
    stl_gd_iters: 200
    stl_gd_step_size: 1.27
    stl_approx_method: "true"
    stl_temperature: null
